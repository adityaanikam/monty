[package]
name = "monty-runtime"
readme = "README.md"
version = { workspace = true }
license = { workspace = true }
rust-version = { workspace = true }
edition = { workspace = true }
authors = { workspace = true }
description = { workspace = true }
keywords = { workspace = true }
categories = { workspace = true }
homepage = { workspace = true }
repository = { workspace = true }

[[bin]]
name = "monty"
path = "src/main.rs"

[dependencies]
clap = { workspace = true }
monty = { workspace = true }
monty-fs = { workspace = true }
monty-proto = { workspace = true, features = ["worker"] }
monty-type-checking = { workspace = true }
monty-types = { workspace = true }
rustyline = "15"

# Safe wrapper over get/setrlimit, for the `subprocess` hard memory ceiling
# (see src/rlimit.rs). Linux-only: no other target has a usable
# equivalent, so the dependency is not pulled in there at all.
[target.'cfg(target_os = "linux")'.dependencies]
rlimit = "0.11"

[dev-dependencies]
tempfile = "3"

[lints]
workspace = true
